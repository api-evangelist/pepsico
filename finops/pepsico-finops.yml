    dimensions:
      - partner_type
      - business_unit
principles:
  - name: Visibility
    description: Track integration spend at the contract level; visibility into per-transaction cost
      depends on what the partner agreement specifies.
  - name: Allocation
    description: Allocate the integration contract cost to the consuming line of business (retail,
      foodservice, supply chain).
  - name: Optimization
    description: Consolidate redundant point-to-point integrations under a single managed file
      transfer or EDI VAN to reduce middleware overhead.
  - name: Accountability
    description: The PepsiCo account owner on the partner side and the PepsiCo business unit
      counterpart jointly own the integration relationship.
