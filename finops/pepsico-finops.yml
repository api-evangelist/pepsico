notes: PepsiCo does not sell APIs or platform services as a self-service product. There is no public
  invoice surface to model. This artifact captures the FinOps shape only at the contract level for
  partner / B2B integration spend.
description: PepsiCo is not a software / API vendor; it is a food and beverage company. From a
  FinOps perspective, there is no metered API SKU. Any spend related to PepsiCo integration is the
  consuming partner's own infrastructure and middleware (EDI, integration platform) cost, plus any
  contracted integration fees.
